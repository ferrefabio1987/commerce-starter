# Production stack for ONE store:
#   Caddy (HTTPS) -> storefront (Next.js) + server (Medusa API/Admin)
#   worker (Medusa background jobs), migrate (one-off), PostgreSQL, Redis
#
#   cp deploy/.env.production.example deploy/.env.production   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# PostgreSQL and Redis publish no ports; only Caddy is reachable from outside.
# Seeds never run automatically. See README "Production deployment".

name: commerce

x-backend: &backend
  image: ${BACKEND_IMAGE:-commerce-backend:latest}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  restart: unless-stopped
  volumes:
    - uploads:/app/static
  environment: &backend-env
    NODE_ENV: production
    # Private network only, so no TLS (Medusa otherwise forces SSL for non-localhost hosts).
    DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medusa}?sslmode=disable
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
    COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET (openssl rand -hex 32)}
    STORE_CORS: ${STOREFRONT_URL:?set STOREFRONT_URL}
    ADMIN_CORS: ${BACKEND_URL:?set BACKEND_URL}
    AUTH_CORS: ${STOREFRONT_URL},${BACKEND_URL}
    MEDUSA_BACKEND_URL: ${BACKEND_URL}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_FILE_URL: ${S3_FILE_URL:-}
    S3_REGION: ${S3_REGION:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs on every `up`: applies pending migrations, then exits. Idempotent.
  migrate:
    <<: *backend
    restart: "no"
    command: ["node_modules/.bin/medusa", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  server:
    <<: *backend
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }

  storefront:
    image: ${STOREFRONT_IMAGE:-commerce-storefront:latest}
    build:
      context: ..
      dockerfile: deploy/storefront.Dockerfile
      # Inlined at build time: rebuild the image after changing any of these.
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-de}
        NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL}
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
    restart: unless-stopped
    environment:
      MEDUSA_BACKEND_INTERNAL_URL: http://server:9000
      STOREFRONT_REVALIDATE_SECONDS: ${STOREFRONT_REVALIDATE_SECONDS:-60}
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?set STOREFRONT_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?set BACKEND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storefront
      - server

  # Optional self-hosted S3-compatible storage (SeaweedFS, Apache-2.0):
  # start with `--profile s3` and use the S3_* values from .env.production.example.
  s3:
    image: chrislusf/seaweedfs:latest
    profiles: ["s3"]
    restart: unless-stopped
    entrypoint: ["sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - ./seaweedfs-start.sh:/start.sh:ro
      - s3-data:/data

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
  s3-data:
